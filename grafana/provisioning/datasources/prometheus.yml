apiVersion: 1

# Datasources provisioned automatically
datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Default scrape interval
      scrapeInterval: "15s"
      # Query timeout
      queryTimeout: "60s"
      # Minimum query interval
      timeInterval: "15s"
      # Exemplar trace ID destinations
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
    version: 1 

  # Loki datasource for logs
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      # Loki-specific settings
      maxLines: 1000
      # Log query timeout
      queryTimeout: "60s"
      # Search settings
      search:
        maxLines: 1000
    version: 1 