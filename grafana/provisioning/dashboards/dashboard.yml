apiVersion: 1

providers:
  # Dashboard provider that loads local files
  - name: 'local-dashboards'
    orgId: 1
    folder: 'Monitoring'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards 