# Simplified Grafana Agent (Alloy) configuration for 2-pro_monitor
# The agent only collects logs. Metrics are scraped directly by Prometheus
# (see prometheus/prometheus.yml), so no metrics pipeline is configured here.

# Server configuration
server:
  log_level: info

# Logs configuration
logs:
  configs:
    - name: default
      positions:
        filename: /tmp/positions.yaml

      # Clients that push logs to Loki
      clients:
        - url: http://loki:3100/loki/api/v1/push
          external_labels:
            environment: production

      # Containers are discovered through the Docker API, so logs are matched
      # by container name instead of by on-disk path (which uses container IDs).
      scrape_configs:
        # Flask application logs (structured JSON)
        - job_name: flask-app-logs
          docker_sd_configs:
            - host: unix:///var/run/docker.sock
              refresh_interval: 5s
              filters:
                - name: name
                  values: [sample-app]
          relabel_configs:
            - source_labels: [__meta_docker_container_name]
              regex: /(.*)
              target_label: container
            - target_label: job
              replacement: flask-app-logs
            - target_label: service
              replacement: web-app
            - source_labels: [__meta_docker_container_log_stream]
              target_label: stream

          # Pipeline that processes Flask application logs
          pipeline_stages:
            - json:
                expressions:
                  level: level
                  component: component
            - labels:
                level:
                component:

        # General Docker logs (all containers)
        - job_name: docker-logs
          docker_sd_configs:
            - host: unix:///var/run/docker.sock
              refresh_interval: 5s
          relabel_configs:
            - source_labels: [__meta_docker_container_name]
              regex: /(.*)
              target_label: container
            - target_label: job
              replacement: docker-logs
            - source_labels: [__meta_docker_container_log_stream]
              target_label: stream
