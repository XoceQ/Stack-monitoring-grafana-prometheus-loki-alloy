# Prometheus global configuration
global:
  scrape_interval: 15s # Global scrape interval
  evaluation_interval: 15s # Rule evaluation interval
  external_labels:
    monitor: 'monitoring-system'

# Alerting rule files
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Scrape jobs
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    metrics_path: /metrics

  # Sample application monitoring
  - job_name: 'sample-app'
    static_configs:
      - targets: ['sample-app:8000']
    scrape_interval: 10s
    metrics_path: /metrics
    scrape_timeout: 5s

  # Host monitoring with Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: /metrics

  # Grafana monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s
    metrics_path: /metrics 