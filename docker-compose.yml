# Monitoring stack: sample API + Prometheus + Loki + Grafana Agent + Grafana + Node Exporter.
# All tunable values come from the .env file (see .env.example). Defaults are provided
# with ${VAR:-default}; secrets are required with ${VAR:?error} and have no default.

name: ${COMPOSE_PROJECT_NAME:-pro-monitor}

# Shared settings reused by every service via YAML anchors
x-restart-policy: &restart-policy
  restart: ${RESTART_POLICY:-unless-stopped}

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: ${LOG_MAX_FILE:-3}

services:
  # Sample application that exposes metrics
  sample-app:
    build:
      context: ./app
    image: ${COMPOSE_PROJECT_NAME:-pro-monitor}/sample-app:${APP_VERSION:-1.0.0}
    container_name: sample-app
    environment:
      APP_PORT: ${APP_PORT:-8000}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: sample-app
      FAKE_LOGS_ENABLED: ${FAKE_LOGS_ENABLED:-true}
      FAKE_LOGS_INTERVAL_SECONDS: ${FAKE_LOGS_INTERVAL_SECONDS:-1.0}
      FAKE_LOGS_INCIDENT_EVERY_SECONDS: ${FAKE_LOGS_INCIDENT_EVERY_SECONDS:-300}
    ports:
      - "${APP_HOST_PORT:-8000}:${APP_PORT:-8000}"
    networks:
      - monitoring
    <<: [*restart-policy, *default-logging]

  # Prometheus server that scrapes metrics
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.55.1}
    container_name: prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-200h}'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - monitoring
    <<: [*restart-policy, *default-logging]

  # Loki for log aggregation
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.4.2}
    container_name: loki
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring
    <<: [*restart-policy, *default-logging]

  # Grafana Agent (static mode) for log collection, replaces Promtail
  alloy:
    image: grafana/agent:${GRAFANA_AGENT_VERSION:-v0.44.2}
    container_name: alloy
    ports:
      - "${ALLOY_HOST_PORT:-12345}:12345"  # Agent's own metrics/UI port
    volumes:
      - ./alloy/alloy-config.yaml:/etc/grafana-agent.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker service discovery for logs
    command: ["-config.file=/etc/grafana-agent.yaml"]
    networks:
      - monitoring
    depends_on:
      - loki
    <<: [*restart-policy, *default-logging]

  # Grafana for visualization
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.6.0}
    container_name: grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
    <<: [*restart-policy, *default-logging]

  # Node Exporter for host system metrics
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.9.1}
    container_name: node-exporter
    ports:
      - "${NODE_EXPORTER_HOST_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring
    <<: [*restart-policy, *default-logging]

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
